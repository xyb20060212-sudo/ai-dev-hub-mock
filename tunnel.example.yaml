config_version: 1
control_plane:
  base_url: https://api.openai.com
  tunnel_id: YOUR_TUNNEL_ID
  organization_id: YOUR_OPENAI_ORGANIZATION_ID
  api_key: env:CONTROL_PLANE_API_KEY
  poll_channels: [main]
  # http_proxy: env:HTTPS_PROXY
mcp:
  commands:
    - channel: main
      command: '"C:/path/to/node.exe" "C:/path/to/chatgpt-local-mcp-demo/src/stdio-server.mjs"'
  stdio_failure_policy: exit
health:
  listen_addr: 127.0.0.1:18786
admin_ui:
  open_browser: false
cloudflared:
  managed: false
